<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Livelli isometrici</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../assets/art.css">
<style>
  .s { --ink: #121b2e; --mute: #5a6478; background: radial-gradient(120% 100% at 30% 40%, #f7f9fc 0%, #e4e9f2 100%);
       color: var(--ink); font-family: "Hanken Grotesk", var(--font); }
  .copy { position: absolute; left: 72px; top: 72px; width: 420px; }
  .copy p.k { font-size: 16px; font-weight: 500; color: var(--mute); }
  .copy h1 { margin-top: 16px; font-size: 54px; line-height: 1.02; font-weight: 700; letter-spacing: -.03em; }
  .copy p.d { margin-top: 22px; font-size: 19px; line-height: 1.5; color: #3b4558; font-weight: 300; }
  /* scena 3D */
  .scene { position: absolute; left: 560px; top: 96px; width: 420px; height: 560px; perspective: 3000px; }
  .stack { position: absolute; left: 50%; top: 58%; width: 300px; height: 300px; margin: -150px 0 0 -150px;
           transform-style: preserve-3d; transform: rotateX(58deg) rotateZ(-45deg); }
  .slab { position: absolute; inset: 0; border-radius: 18px; transform-style: preserve-3d;
          transform: translateZ(calc(var(--i) * 92px)); background: var(--c); box-shadow: inset 0 0 0 1px rgba(255,255,255,.35); }
  .slab::before, .slab::after { content: ""; position: absolute; background: var(--side); }
  .slab::before { left: 10px; right: 10px; bottom: 0; height: 22px; transform-origin: bottom; transform: rotateX(90deg); border-radius: 0 0 6px 6px; }
  .slab::after  { top: 10px; bottom: 10px; right: 0; width: 22px; transform-origin: right; transform: rotateY(-90deg); border-radius: 0 6px 6px 0; }
  .slab span { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 22px; letter-spacing: -.01em; }
  .slab.light span { color: var(--ink); }
  .shadow { position: absolute; inset: 8%; border-radius: 30px; background: rgba(18,27,46,.18); filter: blur(28px); transform: translateZ(-10px); }
  @keyframes lift { from { transform: translateZ(0); opacity: 0; } }
  .slab.anim-lift { animation: lift 1.1s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(.15s + var(--i) * .12s); }
  /* didascalie */
  .tags { position: absolute; left: 1000px; top: 0; width: 230px; height: 720px; }
  .tag-l { position: absolute; left: 0; width: 230px; transform: translateY(-50%); }
  .tag-l b { display: block; font-size: 18px; font-weight: 700; }
  .tag-l span { font-size: 14px; line-height: 1.4; color: var(--mute); }
  .tag-l::before { content: ""; position: absolute; left: -34px; top: 50%; width: 24px; height: 1px; background: #9aa4b8; }
</style>
</head>
<body class="cvl">
<main class="slide art s">
  <div class="copy">
    <p class="k in">Il nuovo modello operativo</p>
    <h1 class="in" style="--d:.1s">Quattro livelli, ciascuno con un solo responsabile</h1>
    <p class="d in" style="--d:.25s">Ogni livello si appoggia su quello sottostante: senza dati e sistemi comuni, nessuno dei servizi sopra può reggere i volumi del 2029.</p>
  </div>
  <div class="scene" aria-hidden="true"><div class="stack" id="stack"><div class="shadow"></div></div></div>
  <div class="tags" id="tags"></div>
</main>
<script src="../../assets/slide.js"></script>
<script>
/* ===== MODIFICA QUI ===== dal basso verso l'alto */
const LIVELLI = [
  { nome: "Dati e sistemi", nota: "Gestionale unico, dati inseriti una volta", c: "#0d366b", side: "#082448" },
  { nome: "Processi", nota: "Centro servizi unico, un solo controllo", c: "#1c5cab", side: "#13417a" },
  { nome: "Servizi", nota: "Offerta per fasce, livelli di servizio garantiti", c: "#3987e5", side: "#2563b0" },
  { nome: "Clienti e canali", nota: "Portale, sportelli, assistenza da remoto", c: "#cde2fb", side: "#9ec5f4", light: true }
];
/* ======================== */
const stack = document.getElementById("stack"), tags = document.getElementById("tags");
LIVELLI.forEach((l, i) => {
  stack.insertAdjacentHTML("beforeend", `<div class="slab anim-lift ${l.light ? "light" : ""}" style="--i:${i};--c:${l.c};--side:${l.side}" title="${l.nome}"></div>`);
});
// didascalie allineate all'altezza di ogni livello (misurata dopo il disegno 3D)
requestAnimationFrame(() => {
  const slide = document.querySelector(".slide"), sr = slide.getBoundingClientRect(), k = sr.width / 1280;
  [...stack.querySelectorAll(".slab")].forEach((el, i) => {
    el.style.animation = "none"; const r = el.getBoundingClientRect(); el.style.animation = "";
    const y = (r.top + r.height / 2 - sr.top) / k;
    tags.insertAdjacentHTML("beforeend", `<div class="tag-l in" style="top:${y}px;--d:${.5 + i * .1}s"><b>${LIVELLI[i].nome}</b><span>${LIVELLI[i].nota}</span></div>`);
  });
});
</script>
</body>
</html>
